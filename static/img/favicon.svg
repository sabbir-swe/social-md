<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ff3d71"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1"    stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <rect width="64" height="64" rx="16" fill="url(#shine)"/>

  <!-- play ▶ turned into a ↓ download arrow -->
  <g filter="url(#soft)">
    <path d="M32 12v14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M21 26h22L32 39z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M16 44v3a5 5 0 0 0 5 5h22a5 5 0 0 0 5-5v-3"
          fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>